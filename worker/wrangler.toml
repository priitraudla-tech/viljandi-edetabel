# Cloudflare Worker: äratab MV-uuenduse täpsel ajal.
#
# Miks see olemas on: GitHubi enda cron on tasuta plaanil "mitte varem kui",
# mitte täpne aeg — 17.-18.08.2026 mõõdetud vahed olid 30...88 min (keskmine
# ~53). Cloudflare'i cron käivitub minutipealt ja workflow_dispatch'iga
# käivitatud jooks ei lähe GitHubi ajastusjärjekorda, vaid startib sekunditega.
#
# See Worker EI dubleeri tõmbamise loogikat — see ainult vajutab nuppu.

name = "viljandi-mv-cron"
main = "src/index.js"
compatibility_date = "2026-08-18"

[triggers]
# Iga 30 min turniiripäevadel 17.-21. august (UTC).
# JÄRGMISEKS AASTAKS: muuda kuupäevad siin ja .github/workflows/mv.yml-is.
crons = ["*/30 * 17-21 8 *"]

[observability]
enabled = true
