name: Viljandimaa MV (iga 30 min)

on:
  schedule:
    # VARUVARIANT. Peamine käivitaja on Cloudflare Worker (worker/),
    # mis kutsub workflow_dispatch'i täpsel ajal — GitHubi enda cron on
    # tasuta plaanil 'mitte varem kui', vahed olid 30...88 min.
    # Kaks käivitajat ei tee kahju: concurrency hoiab ära kattumise ja
    # muutumata andmete korral commiti ei tehta.
    # Iga 30 minuti järel turniiripäevadel 17.-21. august.
    # Kuupäevavahemik hoiab ära 48 tühikäiku päevas ülejäänud aastaringi.
    #
    # NB! Miks 7 ja 37, mitte */30: GitHub paneb ajastatud tööd tasuta plaanil
    # järjekorda ja cron on "mitte varem kui", mitte täpne aeg. Täistunni ümber
    # on järjekord kõige pikem — 17.-18.08 mõõdetud vahed olid 30...88 min
    # (keskmine ~53). Täistunnilt eemale nihutamine lühendab ootust, aga ei
    # kaota seda päriselt. Kui on vaja garanteeritud 30 min, tuleb ajastus viia
    # GitHubist välja (nt Cloudflare Worker cron trigger).
    #
    # JÄRGMISEKS AASTAKS: muuda siin kuupäevad ja scripts/mv_fetch.py-s
    # TOURNAMENT_ID / CATEGORY_ID.
    - cron: "7,37 * 17-21 8 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Kaks korraga jooksvat tõmbamist kirjutaksid teineteise commiti üle.
  group: mv-fetch
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kontrolli püramiidi-loogikat
        run: python scripts/test_mv_puramiid.py

      - name: Kontrolli päringu veataluvust
        run: python scripts/test_mv_paring.py

      - name: Tõmba MV loos ja tulemused
        run: python scripts/mv_fetch.py

      - name: Commit
        run: |
          git config user.name "edetabel-bot"
          git config user.email "actions@github.com"
          git add data/mv.json data/puramiid.json
          if git diff --cached --quiet; then
            echo "Muudatusi ei ole."
            exit 0
          fi
          git commit -m "mv: seis $(date -u +'%Y-%m-%d %H:%M') UTC"

          # data/ kaustal on mitu kirjutajat: see töö, laupäevane edetabeli-töö
          # ja püramiidi halduspaneel (kirjutab GitHubi API kaudu suvalisel ajal).
          # Kui rebase satub konflikti, EI lahenda me seda automaatselt — muidu
          # võiks halduri käsitsi sisestatud mäng vaikselt kaduma minna. Jätame
          # jooksu vahele; järgmine jooks 30 min pärast loeb värske seisu ja teeb
          # kõik uuesti. Andmeid ei lähe kaotsi, sest mv.json genereeritakse iga
          # kord nullist ja püramiid loetakse jooksu alguses uuesti sisse.
          if ! git pull --rebase --autostash; then
            git rebase --abort || true
            echo "::warning::Rebase konflikt — jätan selle jooksu vahele, järgmine teeb uuesti."
            exit 0
          fi

          if ! git push; then
            echo "::warning::Push ebaõnnestus (tõenäoliselt võistlev push) — järgmine jooks proovib uuesti."
            exit 0
          fi
